name: Publish CLI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-cli.yml"
      - "packages/cli/**"
      - "packages/contracts/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.json"
      - "tsconfig.base.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI package
        run: pnpm --filter v2-design-system-cli build

      - name: Check published version
        id: version_check
        shell: bash
        run: |
          PACKAGE_NAME=$(node -p "require('./packages/cli/package.json').name")
          LOCAL_VERSION=$(node -p "require('./packages/cli/package.json').version")
          PUBLISHED_VERSION=$(npm view "$PACKAGE_NAME" version 2>/dev/null || true)
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "local_version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          echo "published_version=$PUBLISHED_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish CLI to npm
        if: steps.version_check.outputs.should_publish == 'true'
        run: pnpm publish --filter v2-design-system-cli --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summarize publish result
        run: |
          if [ "${{ steps.version_check.outputs.should_publish }}" = "true" ]; then
            echo "Published ${{ steps.version_check.outputs.package_name }}@${{ steps.version_check.outputs.local_version }} from main."
          else
            echo "Skipped publish because ${{ steps.version_check.outputs.package_name }}@${{ steps.version_check.outputs.local_version }} already exists on npm."
          fi
